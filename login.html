<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pet Food Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- Login Page Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body.login-page {
            background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .login-container {
            background-color: rgba(255, 255, 255, 0.95); padding: 2.5rem;
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%; max-width: 420px;
        }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h2 { color: #333; font-weight: 600; font-size: 1.8rem; }
        .login-header span { font-size: 3rem; display: block; margin-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 20px; }
        .input-group { position: relative; }
        label { font-weight: 600; font-size: 0.9rem; color: #555; margin-bottom: 8px; display: block; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 15px; padding-right: 45px; border: 2px solid transparent;
            background-color: #f0f2f5; border-radius: 10px; font-size: 1rem; transition: all 0.3s ease;
        }
        input:focus {
            outline: none; border-color: #ff9a44; background-color: #fff;
            box-shadow: 0 0 0 4px rgba(255, 154, 68, 0.1);
        }
        .toggle-password {
            position: absolute; right: 15px; top: 42px; cursor: pointer; font-size: 1.2rem; color: #888; user-select: none;
        }
        .login-btn {
            width: 100%; padding: 15px; background: linear-gradient(to right, #ff9a44, #fc6076);
            color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 600;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(252, 96, 118, 0.4); }
        #message-box {
            margin-top: 20px; text-align: center; font-weight: 600; min-height: 1.4em;
            border-radius: 8px; padding: 10px;
        }
        .success { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb;}
        .error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb;}
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-header">
            <span>🐾</span>
            <h2>Pet Shop Login</h2>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <div class="input-group">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="e.g., darshan c" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <span id="togglePasswordBtn" class="toggle-password">👁️</span>
                </div>
                <button type="submit" class="login-btn">Enter Shop</button>
            </div>
        </form>
        <div id="message-box"></div>
    </div>


    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const messageBox = document.getElementById('message-box');
        const loginBtn = document.querySelector('.login-btn');

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener('click', function () {
            const currentType = passwordInput.getAttribute('type');
            if (currentType === 'password') {
                passwordInput.setAttribute('type', 'text');
                this.textContent = '🙈';
            } else {
                passwordInput.setAttribute('type', 'password');
                this.textContent = '👁️';
            }
        });

        // Form Submission
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const usernameValue = usernameInput.value;
            const passwordValue = passwordInput.value;

            messageBox.className = '';
            messageBox.textContent = '';

            if (usernameValue === "darshan c" && passwordValue === "darshi@123") {
                // Success
                messageBox.textContent = "✅ Welcome Darshan! Entering shop...";
                messageBox.className = "success";
                loginBtn.disabled = true;
                loginBtn.style.opacity = "0.7";
                loginBtn.textContent = "Loading...";

                // Redirect to index.html after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'index.html'; 
                }, 1500);

            } else {
                // Failure
                messageBox.textContent = "❌ Incorrect name or password.";
                messageBox.className = "error";
                document.querySelector('.login-container').animate([
                    { transform: 'translateX(0)' }, { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }
                ], { duration: 300 });
            }
        });
    </script>
</body>
</html>
