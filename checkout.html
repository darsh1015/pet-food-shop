<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🐾 Checkout</h1><nav><a href="cart.html">← Back to Cart</a></nav></header>

<div class="checkout-container">
    <div class="checkout-form">
        <h2>Details</h2>
        <form id="payment-form">
            <div class="form-group"><label>Name</label><input type="text" id="name" required placeholder="John Doe"></div>
            <div class="form-group"><label>Address</label><input type="text" required placeholder="123 Pet Street"></div>
            <div class="form-group"><label>Card (Simulated)</label><input type="text" required placeholder="XXXX-XXXX-XXXX-XXXX"></div>
            <button type="submit" class="pay-btn">Place Order</button>
        </form>
    </div>
    <div class="order-summary" id="order-summary">
        <h2>Summary</h2>
        <div id="summary-items"></div>
        <div class="summary-item summary-total"><span>Total:</span><span id="summary-total-amount">₹0</span></div>
    </div>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
    if(cart.length===0) window.location.href='cart.html';

    let total=0;
    cart.forEach(i=>{
        total+=i.price*i.quantity;
        document.getElementById('summary-items').innerHTML+=`<div class="summary-item"><span>${i.name} x${i.quantity}</span><span>₹${i.price*i.quantity}</span></div>`;
    });
    // Note: This simple summary doesn't recalculate tax/shipping for simplicity in this view
    document.getElementById('summary-total-amount').innerText=`₹${total} (approx)`;

    document.getElementById('payment-form').addEventListener('submit',e=>{
        e.preventDefault();
        alert(`Thanks ${document.getElementById('name').value}! Your order has been placed successfully.`);
        localStorage.removeItem('shoppingCart');
        window.location.href='index.html';
    });
</script>
</body>
</html>
